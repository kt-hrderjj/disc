<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
@font-face{font-family:'Paperlogy';font-weight:400;font-style:normal;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2')}
@font-face{font-family:'Paperlogy';font-weight:600;font-style:normal;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2')}
@font-face{font-family:'Paperlogy';font-weight:800;font-style:normal;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2')}
:root{
  color-scheme:light;
  --bg:#f3f5ff; --card:#ffffff; --ink:#1f2547; --ink2:#59608a; --muted:#8c93b5; --line:#e4e8f7; --axis:#c9d0ea;
  --brand:#5b5ff5; --brand-d:#4347d9; --brand-soft:#e9ebff;
  --d:#2a78d6; --i:#eb6834; --s:#1baf7a; --c:#eda100;
  --d-t:#e1edfc; --i-t:#fde7da; --s-t:#d9f4e9; --c-t:#fff0c2;
  --skin:#ffdcc4; --hair:#3b2f4a; --blush:#ff9aa5; --gold:#ffc533; --gold-d:#e39a00; --suit:#2b3163; --tie:#ff5d6c;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 16px/1.6 'Paperlogy','Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,-apple-system,'Segoe UI',sans-serif;
  word-break:keep-all; overflow-wrap:anywhere;
}
h1,h2,h3,p,ul,fieldset{margin:0;padding:0}
ul{list-style:none}
fieldset{border:0;min-width:0}
a{color:inherit;text-underline-offset:3px}
button,input,textarea,select{font:inherit;color:inherit}
b,strong{font-weight:600}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

.col{max-width:560px;margin:0 auto;padding:28px 18px 72px}
.wide{max-width:1060px}
h1{font-size:28px;line-height:1.25;font-weight:800;letter-spacing:-.02em}
h2{font-size:21px;line-height:1.35;font-weight:800;letter-spacing:-.01em}
h3{font-size:17px;line-height:1.4;font-weight:800}
.lead{margin-top:8px;color:var(--ink2)}
.small{font-size:14px;color:var(--ink2)}
.cap{margin-top:10px;font-size:13px;color:var(--ink2)}
.card{background:var(--card);border-radius:22px;padding:24px;box-shadow:0 1px 2px rgba(31,37,71,.05),0 8px 24px rgba(91,95,245,.06)}
.card+.card,.card+.cards,.cards+.card{margin-top:16px}
.card>h2+*,.card>h3+*{margin-top:14px}
.row{display:flex;flex-wrap:wrap;gap:8px}

/* 유형 타일: 유형 색은 유형에만 쓴다 */
.tile{display:inline-flex;align-items:center;justify-content:center;flex:none;width:22px;height:22px;border-radius:7px;font-size:13px;font-weight:800;line-height:1;color:#fff}
.tile.t-d{background:var(--d)} .tile.t-i{background:var(--i)} .tile.t-s{background:var(--s)} .tile.t-c{background:var(--c);color:var(--ink)}
.tile.big{width:64px;height:64px;border-radius:18px;font-size:38px}
.bg-d{background:var(--d-t)} .bg-i{background:var(--i-t)} .bg-s{background:var(--s-t)} .bg-c{background:var(--c-t)} .bg-n{background:var(--brand-soft)}
.mark{display:grid;grid-template-columns:repeat(2,30px);gap:4px}
.mark .tile{width:30px;height:30px;border-radius:9px;font-size:16px}

/* 캐릭터 */
.av{display:block;flex:none;overflow:visible}
.av-n{fill:var(--brand-soft)} .av-d{fill:var(--d-t)} .av-i{fill:var(--i-t)} .av-s{fill:var(--s-t)} .av-c{fill:var(--c-t)}
.av-n,.av-d,.av-i,.av-s,.av-c{stroke:#fff;stroke-width:2.5}
.av-bn{fill:var(--brand)} .av-bd{fill:var(--d)} .av-bi{fill:var(--i)} .av-bs{fill:var(--s)} .av-bc{fill:var(--c)}
.av-suit{fill:var(--suit)} .av-tie{fill:var(--tie)} .av-shirt{fill:#fff}
.av-skin{fill:var(--skin)} .av-hair{fill:var(--hair)} .av-eye{fill:var(--hair)} .av-blush{fill:var(--blush);opacity:.6}
.av-mouth,.av-brow{fill:none;stroke:var(--hair);stroke-width:1.5;stroke-linecap:round}
.av-crown{fill:var(--gold);stroke:var(--gold-d);stroke-width:1;stroke-linejoin:round} .av-gem{fill:var(--tie)}
.who{display:flex;flex-wrap:wrap;gap:6px 12px}
.who-c{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--gold);font-size:11px;font-weight:800;color:var(--ink);vertical-align:middle}

/* 입력 */
.field{display:block;margin-top:20px}
.field>span,.field>legend{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
input[type=text],input[type=number],textarea,select{
  width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;
}
input[type=text]:focus,input[type=number]:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand)}
textarea{min-height:76px;resize:vertical;font-size:14px}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick{position:relative;display:block}
.pick input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.pick span{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:8px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-weight:600}
.pick input:checked+span{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-d)}
.pick input:focus-visible+span{outline:3px solid var(--brand);outline-offset:2px}
.help{display:block;margin-top:6px;font-style:normal;font-size:13px;color:var(--ink2)}
.code-in{font-size:20px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.code-in::placeholder{font-size:16px;font-weight:400;letter-spacing:0;text-transform:none}
.inline{display:flex;gap:8px;margin-top:14px}
.inline input{flex:1;min-width:0}
.inline .btn{flex:none}
.link{border:0;background:none;padding:8px 4px;font-size:14px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.alt{margin-top:6px;text-align:center}
.err{margin-top:10px;font-size:14px;font-weight:600;color:#d0345b}
.btn{
  display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 22px;
  border:1.5px solid var(--line);border-radius:14px;background:#fff;font-weight:600;cursor:pointer;
}
a.btn{text-decoration:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.block{display:flex;width:100%;margin-top:10px}
.btn.sm{min-height:40px;padding:0 15px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.4;cursor:default}
.notes{margin-top:20px;font-size:13px;color:var(--ink2)}
.notes li+li{margin-top:6px}
.aside{margin-top:18px;font-size:14px;color:var(--ink2);text-align:center}

/* 시작 */
.hello{display:flex;align-items:center;gap:16px}
.me-prev{display:flex;align-items:center;gap:14px;margin-top:20px;padding:14px 16px;border-radius:16px;background:var(--bg)}
.me-prev p{font-size:14px;color:var(--ink2)}
.me-prev b{display:block;font-size:16px;color:var(--ink)}

/* 진단 */
.prog{display:flex;align-items:center;gap:12px}
.prog-bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog-bar i{display:block;height:100%;border-radius:4px;background:var(--brand)}
.prog-n{font-size:14px;font-weight:800;color:var(--brand-d);font-variant-numeric:tabular-nums}
.theme{margin-top:6px}
.theme-k{margin-top:20px;font-size:13px;font-weight:600;color:var(--brand-d)}
.scale-key{margin-top:6px;font-size:14px;color:var(--ink2)}
.items li{padding:20px 0;border-bottom:1px solid var(--line)}
.items li:last-child{border-bottom:0;padding-bottom:4px}
.stmt{font-size:17px;font-weight:600;line-height:1.5}
.likert{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.likert label{position:relative;display:block}
.likert input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.likert span{display:flex;align-items:center;justify-content:center;height:48px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-weight:600;font-variant-numeric:tabular-nums}
.likert input:checked+span{background:var(--brand);border-color:var(--brand);color:#fff}
.likert input:focus-visible+span{outline:3px solid var(--brand);outline-offset:2px}
.ends{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--muted)}
.items li.miss .stmt{color:#d0345b}
.nav{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:16px}
.hint{margin-top:12px;font-size:14px;font-weight:600;color:#d0345b}

/* 결과 */
.hero{display:flex;align-items:center;gap:18px}
.hero-n{font-size:15px;color:var(--ink2)}
.hero-t{display:flex;align-items:center;gap:10px;margin-top:2px;font-size:30px;font-weight:800;line-height:1.2;letter-spacing:-.02em}
.hero-s{margin-top:6px;font-size:14px;color:var(--ink2)}
dl{margin:0}
.facts{display:grid;gap:10px}
.facts div{padding:14px 16px;border-radius:16px}
.facts dt{font-size:13px;font-weight:800}
.facts dd{margin:2px 0 0}

.bars{margin-top:4px}
.bar-row{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:6px 12px;padding:8px 0}
.bar-k{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.bar-track{position:relative;height:20px;margin-right:46px;border-left:1.5px solid var(--axis)}
.bar-track i{display:block;height:100%;min-width:2px;border-radius:0 6px 6px 0}
.bar-track em{position:absolute;top:50%;transform:translateY(-50%);white-space:nowrap;margin-left:8px;font-style:normal;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.f-d{background:var(--d)} .f-i{background:var(--i)} .f-s{background:var(--s)} .f-c{background:var(--c)}
.bar-x{grid-column:2;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:13px;color:var(--ink2)}

/* 맵과 줄 세우기 */
.map svg,.strip svg{display:block;width:100%;height:auto}
.q-d{fill:var(--d-t)} .q-i{fill:var(--i-t)} .q-s{fill:var(--s-t)} .q-c{fill:var(--c-t)}
.mx{stroke:#fff;stroke-width:3}
.mt{fill:var(--ink2);font-size:12px;font-weight:600}
.mq{fill:var(--ink);font-size:13px;font-weight:800}
.ml{fill:#fff;font-size:12px;font-weight:800}
.mn{fill:var(--ink);font-size:12px;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.sw-d{fill:var(--d)} .sw-i{fill:var(--i)} .sw-s{fill:var(--s)} .sw-c{fill:var(--c)}
.hit{fill:transparent;cursor:default}
.hit:focus-visible{outline:none;stroke:var(--brand);stroke-width:2.5}
.sx{stroke:var(--axis);stroke-width:2;stroke-linecap:round}
.sd{fill:var(--ink)}
.sg{stroke:var(--brand);stroke-width:6;stroke-linecap:round}
.sm{fill:var(--brand)}
.st{fill:var(--brand-d);font-size:12px;font-weight:800}
.strip{padding:14px 8px 6px;border-radius:18px;background:var(--bg)}

.send{background:var(--brand-soft)}
.send textarea{margin-top:12px;border-color:transparent}
.send .inline input{border-color:transparent}

/* 대시보드 */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.top-l{display:flex;align-items:center;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 4px 4px 6px;border-radius:999px;background:var(--bg);font-size:14px;font-weight:600}
.chip button{width:28px;height:28px;border:0;border-radius:50%;background:transparent;cursor:pointer;font-size:16px;line-height:1;color:var(--ink2)}
.chip.ro{padding-right:12px}
.chip button.arm{width:auto;padding:0 10px;border-radius:999px;background:#d0345b;font-size:13px;font-weight:800;color:#fff}
/* 팀 코드 방식 */
.inv{display:flex;flex-wrap:wrap;align-items:center;gap:16px 28px}
.inv-code{flex:none;padding:14px 24px;border-radius:18px;background:var(--brand-soft);text-align:center}
.inv-k{display:block;font-size:13px;font-weight:600;color:var(--brand-d)}
.code{display:block;font-size:34px;line-height:1.25;font-weight:800;letter-spacing:.14em;color:var(--brand-d)}
.inv-do{flex:1;min-width:240px}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:16px;font-size:14px;font-weight:600;color:var(--ink2)}
.status i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--muted)}
.status span{flex:1;min-width:200px}
.status.s-live i{background:var(--s)}
.status.s-error{color:#b3264a}
.status.s-error i{background:#d0345b}
.note{margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--c-t);font-size:14px}
.chk{margin-top:14px}
.chk li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;font-weight:600}
.chk b{flex:none;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:800}
.chk .ok b{background:var(--s-t);color:#0b6b48}
.chk .no b{background:#fde3ea;color:#b3264a}
.chk span{flex-basis:100%;font-size:13px;font-weight:400;color:var(--ink2)}
details{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-size:14px;font-weight:600}
details.plain{margin-top:0;border-top:0;padding-top:0}
details>*:not(summary){margin-top:12px}
.manual{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.manual .full{grid-column:1/-1}
.manual .half{grid-column:span 2}
.manual label span{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.cards{display:grid;gap:16px}
@media (min-width:880px){.cards.two{grid-template-columns:1.1fr .9fr;align-items:start} .cards.two>.card{margin-top:0}}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child>th,tr:last-child>td{border-bottom:0}
th{font-size:13px;color:var(--ink2);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.nm{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink)}
.sc{min-width:44px}
.sc b{display:block;padding-left:6px;font-weight:800;font-variant-numeric:tabular-nums}
.sc i{display:block;height:7px;margin-top:4px;border-radius:0 4px 4px 0;min-width:1px}
.sc-wrap{border-left:1.5px solid var(--axis)}
.th-k{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 6px;color:var(--ink);font-size:13px;font-weight:800}
.ty{font-weight:800;white-space:nowrap}

/* 해석 */
.keys{display:grid;gap:12px;margin-bottom:16px}
.key{padding:20px;border-radius:20px}
.key-art{display:flex;align-items:center;height:52px;margin-bottom:12px}
.key-art .av+.av{margin-left:-10px}
.key-art .ico{margin:0 8px}
.key-t{font-size:20px;font-weight:800;line-height:1.35;letter-spacing:-.01em}
.key-d{margin-top:8px;font-size:16px;line-height:1.55;color:var(--ink2)}
.pt+.pt,.quad+.pt,.cap+.pt,.asks+.pt,.strip+.pt,.gap+.gap{margin-top:20px}
.pt-w{display:flex;margin-bottom:6px}
.pt-w .av+.av{margin-left:-8px}
.pt-t{font-size:17px;font-weight:800;line-height:1.5}
.pt-d{margin-top:4px;color:var(--ink2)}
.pt .who{margin-top:8px}
.act{display:flex;align-items:center;gap:12px;margin-top:14px;padding:14px 16px;border-radius:16px;background:var(--brand-soft);font-size:18px;font-weight:800;line-height:1.45;color:var(--brand-d)}
.act-k{flex:none;padding:4px 12px;border-radius:999px;background:var(--brand);font-size:13px;font-weight:800;color:#fff}
.gap .act{background:#fff}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qc{padding:16px;border:2.5px solid transparent;border-radius:18px}
.qc.max{border-color:var(--ink)}
.qc-h{display:flex;align-items:center;gap:8px;font-weight:800}
.qc-n{margin-left:auto;font-size:18px;font-variant-numeric:tabular-nums}
.qc-m{margin-top:10px}
.qc-m.none{font-size:14px;color:var(--ink2)}
.gap{padding:22px;border-radius:20px;background:var(--bg)}
.gap-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.gap-k{font-size:20px;font-weight:800}
.gap-w{font-size:24px;font-weight:800;color:var(--brand-d)}
.meter{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.meter i{height:20px;border-radius:10px;background:var(--axis)}
.meter i.on{background:var(--brand)}
.meter-e{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--muted)}
.gap .pt-t{margin-top:16px;font-size:18px}
.duo{display:grid;grid-template-columns:auto minmax(72px,1fr) auto;align-items:center;gap:14px;padding:20px 28px;border-radius:20px;background:var(--bg)}
.duo.near{max-width:460px}
.bg-soft{background:var(--bg)}
.duo-p{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:72px;text-align:center}
.duo-p b{font-size:16px;font-weight:800}
.duo-p span{font-size:13px;color:var(--ink2)}
.duo-m{display:flex;flex-direction:column;align-items:center;gap:6px}
.duo-w{font-size:14px;font-weight:800;color:var(--brand-d)}
.duo-line{display:block;width:100%;height:6px;border-radius:3px;background:var(--brand)}
.duo-tag{font-size:13px;color:var(--ink2);text-align:center}
.sub{margin-top:20px;font-size:14px;font-weight:800}
.asks{display:grid;gap:10px;margin-top:10px}
.ask{position:relative;padding:16px 18px;border-radius:18px}
.ask-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800}
.ask li{position:relative;margin-top:8px;padding-left:14px}
.ask li::before{content:"";position:absolute;left:0;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.qs li{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line);font-size:17px;font-weight:600;line-height:1.5}
.qs li:first-child{padding-top:0;border-top:0}
.qs li::before{content:"Q";flex:none;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;font-size:14px;font-weight:800}
.fine li{margin-top:6px;font-size:13px;color:var(--ink2)}
.fine li:first-child{margin-top:0}
.empty .lead{margin-top:8px}

  /* 가장 비슷한 두 사람: 같은 점, 함께하면 잘 되는 것, 조심할 것 */

      a.far.slice(1).forEach(function (p) {
        var x = pairText(p);

    var Q = [];
    if (emptyQ.length) Q.push(style(emptyQ[0]) + '이 뚜렷한 사람이 없습니다. ' + TEAM[emptyQ[0]].role + '을 지금은 누가 맡고 있나요?');

    if (g && ly >= 2) Q.push('리더와 팀원의 속도 차이를 줄이려면 회의나 보고 방식에서 무엇을 바꾸면 좋을까요?');
    if (!Q.length) Q.push('우리 팀이 일하는 방식에서 가장 잘 맞는 점과 가장 어긋나는 점은 무엇인가요?');
    secs.push({ id: 'q', h: '함께 이야기할 질문', questions: Q });
    secs.push(cautions);
    return { keys: keys, secs: secs };
  }

  return { TYPES: TYPES, TYPE_INFO: TYPE_INFO, THEMES: THEMES, ITEMS: ITEMS, DEMO: DEMO,
    scoreAnswers: scoreAnswers, rank: rank, types: types, coords: coords, spread: spread, zone: zone,
    cleanMember: cleanMember, encodeMember: encodeMember, decodeMember: decodeMember,
    encodeTeam: encodeTeam, decodeTeam: decodeTeam, extractCodes: extractCodes,
    analyze: analyze, report: report, sgn1: sgn1, paceWord: paceWord, focusWord: focusWord };
})();
if (typeof module !== 'undefined') module.exports = Core;

          '<button class="btn sm" id="chk">연결 점검</button></div>' +
          '<div id="chk-out" aria-live="polite"></div>';
        /* 코드를 받아 들어온 팀원에게는 접어 두어, 실수로 새 팀을 만들지 않게 한다 */
        return codeVal && !(rm && rm.owner) ? '<details class="plain"><summary>진행자용 메뉴</summary>' + body + '</details>' : '<h2>진행자이신가요?</h2>' + body;
      })() + '</section>'
        : '<p class="aside">진행자라면 <a href="#team">팀 대시보드</a>를 여세요.</p>') +
      '</main>';
    var pick = function (n) { return app.querySelector('input[name=' + n + ']:checked').value; };
    var prev = function () {
      document.getElementById('prev').innerHTML = avatar({ g: pick('g'), role: pick('role') }, 64);
      var nm = document.getElementById('name').value.trim();
      document.getElementById('prev-n').textContent = (nm || '이름') + (pick('role') === 'L' ? ' (리더)' : '');
    };
    prev();
    var errEl = document.getElementById('err');
    var showErr = function (msg, focusId) { errEl.textContent = msg; errEl.hidden = false; var f = document.getElementById(focusId); if (f) f.focus(); };
    var readName = function () { return document.getElementById('name').value.replace(/\s+/g, ' ').trim().slice(0, 20); };
    document.getElementById('start').addEventListener('input', function () { errEl.hidden = true; prev(); });
    document.getElementById('start').addEventListener('change', prev);
    var begin = function (nm) {
      var order = [];
      for (var i = 0; i < 15; i++) {
        var o = [0, 1, 2, 3];
        for (var j = 3; j > 0; j--) { var k = Math.floor(Math.random() * (j + 1)), tmp = o[j]; o[j] = o[k]; o[k] = tmp; }
        order.push(o);
      }
      var ans = []; for (var q = 0; q < 60; q++) ans.push(null);
      store.set(K.progress, { name: nm, role: pick('role'), g: pick('g'), ans: ans, order: order, page: 0 });
      joinCode = ''; send = { st: 'idle', msg: '' };
      go('#test');
    };
    document.getElementById('start').addEventListener('submit', function (e) {
      e.preventDefault();
      var nm = readName();
      if (!nm) { showErr('이름을 입력해 주세요.', 'name'); return; }
      if (!CL) { begin(nm); return; }
      var code = CL.norm(document.getElementById('code').value);
      if (code.length !== 6) { showErr('팀 코드 6자리를 입력해 주세요.', 'code'); return; }
      var btn = e.currentTarget.querySelector('button[type=submit]'), label = btn.textContent, settled = false;
      btn.disabled = true; btn.textContent = '팀 확인 중';
      /* 연결이 안 되면 진단은 먼저 하고, 마친 뒤에 다시 제출한다 */
      var later = function () {
        if (settled || view !== 'home') return; settled = true;
        setRoom(code, false); begin(nm);
        toast('지금은 팀에 연결할 수 없습니다. 진단을 마치면 다시 제출합니다.');
      };
      var slow = setTimeout(later, 8000);
      CL.find(code).then(function (found) {
        clearTimeout(slow);
        if (settled || view !== 'home') return; settled = true;
        if (!found) { btn.disabled = false; btn.textContent = label; showErr('이 코드의 팀을 찾을 수 없습니다. 코드를 다시 확인해 주세요.', 'code'); return; }
        setRoom(code, found.owner); begin(nm);
      }, function () { clearTimeout(slow); later(); });
    });
    var r = document.getElementById('resume'); if (r) r.addEventListener('click', function () { go('#test'); });
    var m = document.getElementById('mine'); if (m) m.addEventListener('click', function () { go('#result'); });
    var solo = document.getElementById('solo');
    if (solo) solo.addEventListener('click', function () {
      var nm = readName();
      if (!nm) { showErr('이름을 입력해 주세요.', 'name'); return; }
      begin(nm);
    });
    var mk = document.getElementById('mk'), out = document.getElementById('chk-out');
    if (mk) mk.addEventListener('click', function () {
      var run = function () {
        mk.disabled = true; mk.textContent = '만드는 중';
        CL.create().then(function (code) {
          setRoom(code, true); toast('팀을 만들었습니다. 팀 코드는 ' + code + '입니다.'); go('#team');
        }, function (err) {
          mk.disabled = false; mk.textContent = '새 팀 만들기'; delete mk.dataset.armed;
          out.innerHTML = '<p class="err">' + esc(CL.explain(err)) + '</p>';
        });
      };
      if (rm && rm.owner) confirmTwice(mk, '한 번 더 누르면 새 팀으로 바꿉니다', run); else run();
    });
    var chk = document.getElementById('chk');
    if (chk) chk.addEventListener('click', function () {
      chk.disabled = true; out.innerHTML = '<p class="small" style="margin-top:14px">점검하는 중입니다. 실제로 써 보고 지우는 데 몇 초 걸립니다.</p>';
      CL.check().then(function (list) {
        chk.disabled = false;
        var bad = list.filter(function (x) { return !x.ok; }).length;
        out.innerHTML = '<ul class="chk">' + list.map(function (x) {
          return '<li class="' + (x.ok ? 'ok' : 'no') + '"><b>' + (x.ok ? '통과' : '실패') + '</b>' + esc(x.label) + (x.msg ? '<span>' + esc(x.msg) + '</span>' : '') + '</li>';
        }).join('') + '</ul><p class="small" style="margin-top:10px">' + (bad ? '실패한 항목을 고친 뒤 다시 점검해 주세요.' : '모든 항목이 통과했습니다. 팀을 만들어도 됩니다.') + '</p>';
      });
    });
  }

  /* ---------- 진단 ---------- */
  function renderTest() {
    drawn = null;
    var p = store.get(K.progress);
    if (!p || !Array.isArray(p.ans) || p.ans.length !== 60) { go('#'); return; }
    var pg = Math.max(0, Math.min(14, p.page | 0)), base = pg * 4, order = p.order[pg];
    app.innerHTML =
      '<main class="col"><section class="card">' +
      '<div class="prog"><div class="prog-bar" role="progressbar" aria-label="진행" aria-valuemin="1" aria-valuemax="15" aria-valuenow="' + (pg + 1) + '"><i style="width:' + ((pg + 1) / 15 * 100) + '%"></i></div>' +
      '<span class="prog-n">' + (pg + 1) + ' / 15</span></div>' +
      '<p class="theme-k">이런 상황에서 나는</p><h2 class="theme">' + esc(Core.THEMES[pg]) + '</h2>' +
      '<p class="scale-key">평소의 나와 얼마나 가까운지 1(전혀 아니다)부터 5(매우 그렇다)까지 골라 주세요.</p>' +
      '<ul class="items">' + order.map(function (k) {
        var idx = base + k;
        return '<li data-q="' + idx + '"><p class="stmt" id="q' + idx + '">' + esc(Core.ITEMS[idx]) + '</p>' +
          '<div class="likert" role="radiogroup" aria-labelledby="q' + idx + '">' +
          [1, 2, 3, 4, 5].map(function (v) {
            return '<label><input type="radio" name="a' + idx + '" value="' + v + '"' + (p.ans[idx] === v ? ' checked' : '') + '><span>' + v + '</span></label>';
          }).join('') + '</div>' +
          '<div class="ends" aria-hidden="true"><span>전혀 아니다</span><span>매우 그렇다</span></div></li>';
      }).join('') + '</ul>' +
      '<div class="nav"><button class="btn" id="prev"' + (pg === 0 ? ' disabled' : '') + '>이전</button>' +
      '<button class="btn primary" id="next">' + (pg === 14 ? '결과 보기' : '다음') + '</button></div>' +
      '<p class="hint" id="need" hidden>색이 바뀐 문항에 답해 주세요.</p>' +
      '</section></main>';
    app.querySelectorAll('.likert input').forEach(function (inp) {
      inp.addEventListener('change', function () {
        var cur = store.get(K.progress); if (!cur) return;
        cur.ans[Number(inp.name.slice(1))] = Number(inp.value); store.set(K.progress, cur);
        var li = inp.closest('li'); if (li) li.classList.remove('miss');
      });
    });
    document.getElementById('prev').addEventListener('click', function () {
      var cur = store.get(K.progress); cur.page = pg - 1; store.set(K.progress, cur); renderTest(); window.scrollTo(0, 0);
    });
    document.getElementById('next').addEventListener('click', function () {
      var cur = store.get(K.progress), miss = [];
      for (var i = base; i < base + 4; i++) if (!cur.ans[i]) miss.push(i);
      if (miss.length) {
        app.querySelectorAll('.items li').forEach(function (li) { li.classList.toggle('miss', miss.indexOf(Number(li.dataset.q)) >= 0); });
        document.getElementById('need').hidden = false;
        var first = app.querySelector('.items li.miss'); if (first && first.scrollIntoView) first.scrollIntoView({ block: 'center' });
        return;
      }
      if (pg < 14) { cur.page = pg + 1; store.set(K.progress, cur); renderTest(); window.scrollTo(0, 0); return; }
      if (cur.ans.some(function (v) { return !v; })) { cur.page = Math.floor(cur.ans.findIndex(function (v) { return !v; }) / 4); store.set(K.progress, cur); renderTest(); return; }
      store.set(K.me, { name: cur.name, role: cur.role, g: cur.g, s: Core.scoreAnswers(cur.ans) });
      store.del(K.progress);
      go('#result'); window.scrollTo(0, 0);
    });
  }

  /* ---------- 개인 결과 ---------- */

    app.innerHTML =

      '</section>' +

      (navigator.share ? '<button class="btn" id="share">다른 앱으로 보내기</button>' : '') + '</div>' +

      '<section class="card"><h2>유형별 점수</h2>' + bars(me.s) +

      '<section class="card"><h2>맵 위의 내 위치</h2><div class="map" id="map"></div>' +
      '<p class="cap">속도는 ' + Core.paceWord(row.y) + ', 일과 사람 중에서는 ' + Core.focusWord(row.x) + '입니다. 가운데에 가까울수록 여러 방식을 섞어 씁니다.</p></section>' +
      '<div class="row" style="margin-top:18px"><button class="btn sm" id="redo">다시 진단하기</button><a class="btn sm" href="#">처음 화면으로</a></div>' +

    drawn = { a: a, single: a.rows, lim: Math.max(50, a.lim) };

        else { var ta = document.getElementById('link'); ta.focus(); ta.select(); toast('복사가 막혀 있습니다. 아래 글을 길게 눌러 복사해 주세요.'); }
      });

    var sh = document.getElementById('share');
    if (sh) sh.addEventListener('click', function () { navigator.share({ text: msg }).catch(function () {}); });
    document.getElementById('redo').addEventListener('click', function (e) {
      confirmTwice(e.currentTarget, '한 번 더 누르면 결과가 지워집니다', function () { store.del(K.me); store.del(K.progress); go('#'); });
    });

  /* ---------- 팀 대시보드 ---------- */
  function memberTable(a) {
    var head = '<tr><th scope="col">이름</th><th scope="col">유형</th>' + T.map(function (t) {
      return '<th scope="col"><span class="th-k">' + tile(t) + INFO[t].short + '</span></th>';
    }).join('') + '</tr>';
    var rows = a.rows.map(function (r) {
      return '<tr><th scope="row"><span class="nm">' + avatar(r, 30) + '<span>' + esc(r.name) + leadTag(r) + '</span></span></th>' +
        '<td class="ty">' + r.p + '/' + r.q + '</td>' + T.map(function (t, i) {
          return '<td class="sc"><div class="sc-wrap"><b>' + r.s[i] + '</b><i class="f-' + t.toLowerCase() + '" style="width:' + r.s[i] + '%"></i></div></td>';
        }).join('') + '</tr>';
    }).join('');
    return '<table><thead>' + head + '</thead><tbody>' + rows + '</tbody></table>';
  }
  function coordTable(a) {
    return '<table><thead><tr><th scope="col">이름</th><th scope="col" class="num">가로 (일과 사람)</th><th scope="col" class="num">세로 (속도)</th></tr></thead><tbody>' +
      a.rows.map(function (r) {
        return '<tr><th scope="row">' + esc(r.name) + '</th><td class="num">' + Core.sgn1(r.x) + '</td><td class="num">' + Core.sgn1(r.y) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }
  var ICON = {
    fast: '<svg class="ico" width="40" height="26" viewBox="0 0 40 26" aria-hidden="true"><path d="M3 6h13M8 13h13M3 20h13" fill="none" stroke="var(--brand)" stroke-width="3.5" stroke-linecap="round"/><path d="M25 5l10 8-10 8" fill="none" stroke="var(--brand)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    vs: '<svg class="ico" width="40" height="26" viewBox="0 0 40 26" aria-hidden="true"><path d="M9 13h22M14 7l-6 6 6 6M26 7l6 6-6 6" fill="none" stroke="var(--brand)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };
  function point(p) {
    return '<div class="pt">' + (p.who ? '<div class="pt-w">' + p.who.map(function (r) { return avatar(r, 30); }).join('') + '</div>' : '') +
      '<p class="pt-t">' + esc(p.t) + '</p>' + (p.d ? '<p class="pt-d">' + esc(p.d) + '</p>' : '') +
      (p.act ? '<p class="act"><span class="act-k">제안</span><span>' + esc(p.act) + '</span></p>' : '') + '</div>';
  }
  function reportHtml(a) {
    var r = Core.report(a);
    if (!r) return '';
    var h = '<div class="keys">' + r.keys.map(function (k) {
      var art = '', bg = 'bg-n';
      if (k.icon === 'crowd' || k.icon === 'few') { art = k.who.slice(0, 5).map(function (x) { return avatar(x, 46); }).join(''); if (k.icon === 'crowd' && k.who.length && k.who.every(function (x) { return x.zone === k.who[0].zone; }) && INFO[k.who[0].zone]) bg = 'bg-' + k.who[0].zone.toLowerCase(); }
      else if (k.icon === 'leader') art = k.who.slice(0, 2).map(function (x) { return avatar(x, 46); }).join('') + ICON.fast;
      else if (k.icon === 'pair' && k.who.length === 2) art = avatar(k.who[0], 46) + ICON.vs + avatar(k.who[1], 46);
      else art = ICON.vs;
      return '<div class="key ' + bg + '"><div class="key-art">' + art + '</div><p class="key-t">' + esc(k.t) + '</p><p class="key-d">' + esc(k.d) + '</p></div>';
    }).join('') + '</div>';
    return h + r.secs.map(function (s) {
      var b = '';
      if (s.grid) {
        b += '<div class="quad">' + s.grid.map(function (c) {
          return '<div class="qc bg-' + c.t.toLowerCase() + (c.max ? ' max' : '') + '"><p class="qc-h">' + tile(c.t) + '<span>' + esc(c.label) + '</span><span class="qc-n">' + c.rows.length + '명</span></p>' +
            (c.rows.length ? '<div class="qc-m who">' + whoChips(c.rows, 28) + '</div>' : '<p class="qc-m none">뚜렷한 사람 없음</p>') + '</div>';
        }).join('') + '</div>';
        if (s.edges.length) b += '<p class="cap">두 스타일 사이에 걸친 사람: ' + esc(s.edges.join(', ')) + '</p>';
      }
      if (s.strip) b += '<div class="strip" data-k="' + s.strip + '" data-l="' + esc(s.ends[0]) + '" data-r="' + esc(s.ends[1]) + '"></div>';
      if (s.gaps) b += s.gaps.map(function (x) {
        var segs = ''; for (var i = 1; i <= 4; i++) segs += '<i' + (i <= x.level ? ' class="on"' : '') + '></i>';
        return '<div class="gap"><div class="gap-h"><span class="gap-k">' + esc(x.k) + '</span><span class="gap-w">' + esc(x.word) + '</span></div>' +
          '<div class="meter" role="img" aria-label="차이 4칸 중 ' + x.level + '칸">' + segs + '</div>' +
          '<div class="meter-e" aria-hidden="true"><span>거의 같음</span><span>아주 많이 다름</span></div>' +
          '<p class="pt-t">' + esc(x.t) + '</p>' + (x.act ? '<p class="act"><span class="act-k">제안</span><span>' + esc(x.act) + '</span></p>' : '') + '</div>';
      }).join('');
      var duo = function (x) { return '<div class="duo-p">' + avatar(x, 60) + '<b>' + esc(x.name) + '</b><span>' + INFO[x.p].name + '</span></div>'; };
      var lis = function (arr) { return arr.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join(''); };
      if (s.twin) {
        var w = s.twin;
        b += '<div class="duo near">' + duo(w.a) + '<div class="duo-m"><span class="duo-w">' + esc(w.word) + '</span><span class="duo-line"></span><span class="duo-tag">' + esc(w.tag) + '</span></div>' + duo(w.b) + '</div>' +
          '<p class="pt-d" style="margin-top:12px">' + esc(w.d) + '</p>' +
          '<div class="asks"><div class="ask bg-n"><p class="ask-h">함께하면 잘 되는 것</p><ul>' + lis(w.good) + '</ul></div>' +
          '<div class="ask bg-soft"><p class="ask-h">함께할 때 조심할 것</p><ul>' + lis(w.risk) + '</ul></div></div>' +
          '<p class="act"><span class="act-k">제안</span><span>' + esc(w.act) + '</span></p>';
      }
      if (s.pair) {
        b += '<div class="duo">' + duo(s.pair.a) + '<div class="duo-m"><span class="duo-w">' + esc(s.pair.word) + '</span><span class="duo-line"></span><span class="duo-tag">' + esc(s.pair.tag) + '</span></div>' + duo(s.pair.b) + '</div>' +
          '<p class="pt-d" style="margin-top:12px">' + esc(s.pair.d) + '</p><p class="sub">서로에게 부탁할 만한 것</p><div class="asks">' + s.pair.asks.map(function (k) {
            return '<div class="ask bg-' + k.from.p.toLowerCase() + '"><p class="ask-h">' + avatar(k.from, 30) + '<span>' + esc(k.from.name) + ' 님이 ' + esc(k.to.name) + ' 님에게</span></p><ul>' +
              k.list.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
          }).join('') + '</div>';
      }
      b += (s.points || []).map(point).join('');
      if (s.groups) b += s.groups.map(function (gp) {
        return '<div class="pt"><p class="pt-t">' + esc(gp.t) + '</p><div class="who">' + whoChips(gp.rows, 28) + '</div><p class="pt-d" style="margin-top:8px">' + esc(gp.d) + '</p></div>';
      }).join('');

  /* ---------- 팀 코드 방식: 제출 ---------- */
  function paintSend() {

    if (send.st === 'busy') {

    } else if (!rm) {
      h = '<h2>팀에 제출하기</h2><p class="small">진행자가 알려 준 팀 코드를 입력하면 내 결과가 팀 대시보드에 올라갑니다.</p>' +
        '<form class="inline" id="joinf" novalidate>' + codeInput('jcode', '', '팀 코드') + '<button class="btn primary" type="submit">제출</button></form>' +

    } else if (me && rm.sent === sig(me)) {
      h = '<h2>팀에 제출했습니다</h2><p class="small">팀 ' + rm.code + '의 대시보드에 내 결과가 올라갔습니다. 다시 진단하면 새 결과로 바뀝니다.</p>' +
        '<div class="row" style="margin-top:14px"><a class="btn primary" href="#team">팀 결과 보기</a><button class="btn" id="resend">다시 제출</button></div>';
    } else {
      h = '<h2>아직 제출되지 않았습니다</h2><p class="small">팀 ' + rm.code + '에 결과를 보내지 못했습니다.</p>' +
        (send.msg ? '<p class="err" role="alert">' + esc(send.msg) + '</p>' : '') +
        '<div class="row" style="margin-top:14px"><button class="btn primary" id="resend">다시 제출</button><button class="btn" id="chg">팀 코드 바꾸기</button></div>';
    }
    box.innerHTML = h;
    var on = function (id, ev, fn) { var el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
    on('resend', 'click', function () { trySend(true); });
    on('chg', 'click', function () { store.del(K.room); send = { st: 'idle', msg: '' }; paintSend(); });
    on('joinf', 'submit', function (e) {
      e.preventDefault();
      var code = CL.norm(document.getElementById('jcode').value);
      if (code.length !== 6) { send = { st: 'idle', msg: '팀 코드 6자리를 입력해 주세요.' }; paintSend(); return; }
      send = { st: 'busy', msg: '' }; paintSend();
      CL.find(code).then(function (found) {
        send = { st: 'idle', msg: found ? '' : '이 코드의 팀을 찾을 수 없습니다. 코드를 다시 확인해 주세요.' };
        if (found) { setRoom(code, found.owner); trySend(false); } else paintSend();
      }, function (err) { send = { st: 'idle', msg: CL.explain(err) }; paintSend(); });
    });
  }
  /* 아직 보내지 않은 결과가 있으면 보낸다. force면 이미 보낸 결과도 다시 보낸다. */
  function trySend(force) {
    var rm = room(), me = Core.cleanMember(store.get(K.me));
    if (!CL || !rm || !me || send.st === 'busy') return;
    if (!force && rm.sent === sig(me)) return;
    send = { st: 'busy', msg: '' }; paintSend();
    var mark = function (v) { var r = room(); if (r && r.code === rm.code) { r.sent = v; store.set(K.room, r); } };
    CL.submit(rm.code, me).then(function () {
      mark(sig(me)); send = { st: 'idle', msg: '' }; paintSend();
      if (view === 'result') toast('팀 ' + rm.code + '에 제출했습니다.');
    }, function (e) {
      mark(''); send = { st: 'idle', msg: CL.explain(e) }; paintSend();
    });
  }

  /* ---------- 팀 코드 방식: 대시보드 ---------- */
  function detach() { if (live && live.stop) live.stop(); live = null; }
  function snap(x) { return x.state + '|' + x.owner + '|' + JSON.stringify(x.members); }
  /* 팀의 제출 목록을 실시간으로 받는다. 같은 팀이면 이미 받고 있는 것을 그대로 쓴다. */
  function attach(code) {
    if (live && live.code === code) return;
    detach();
    var cur = live = { code: code, state: 'wait', members: [], owner: false, err: null, seen: false, stop: null };
    cur.stop = CL.watch(code, function (ev) {
      if (live !== cur) return;
      var was = snap(cur), known = cur.members.map(function (m) { return m.id; }), fresh = [];
      cur.state = ev.state; cur.err = ev.err || null;
      if (ev.state === 'live') {
        if (cur.seen) fresh = ev.members.filter(function (m) { return known.indexOf(m.id) < 0; });
        cur.members = ev.members; cur.owner = ev.owner; cur.seen = true;
        var r = room();
        if (r && r.code === code && r.owner !== ev.owner) { r.owner = ev.owner; store.set(K.room, r); }
      } else if (ev.state === 'gone') cur.members = [];
      if (view !== 'team') return;
      if (was !== snap(cur)) renderTeam();
      if (fresh.length) toast(fresh.map(function (m) { return m.name; }).join(', ') + ' 님이 제출했습니다.');
    });
  }
  function inviteText(code) {
    return '팀 DISC 진단에 참여해 주세요. 10분쯤 걸립니다.\n' + baseUrl() + '#j=' + code + '\n팀 코드: ' + code;
  }

        '<section class="card"><h2>팀 결과 보기</h2><p class="small">팀 코드를 입력하면 그 팀의 결과를 볼 수 있습니다.</p>' +
        '<form class="inline" id="openf" novalidate>' + codeInput('ocode', '', '팀 코드') + '<button class="btn primary" type="submit">열기</button></form>' +
        '<p class="err" id="oerr" role="alert" hidden></p></section></main>';
      document.getElementById('openf').addEventListener('submit', function (e) {
        e.preventDefault();
        var code = CL.norm(document.getElementById('ocode').value), err = document.getElementById('oerr'), btn = e.currentTarget.querySelector('button');

          if (!found) { say('이 코드의 팀을 찾을 수 없습니다. 코드를 다시 확인해 주세요.'); return; }
          setRoom(code, found.owner); if (view === 'team') renderTeam();
        }, function (x) { say(CL.explain(x)); });
      });
      return;
    }
    attach(rm.code);
    var st = live.state, members = live.members, owner = live.seen ? live.owner : !!rm.owner;
    if (st === 'gone') {
      detach(); store.del(K.room);

      : '<p class="status"><i></i><span>' + (live.seen ? '연결이 끊겼습니다. 다시 연결하는 중입니다.' : '팀에 연결하는 중입니다.') + '</span></p>';

      '<section class="card"><div class="inv"><div class="inv-code"><span class="inv-k">팀 코드</span><b class="code">' + rm.code + '</b></div>' +

        : '이 팀의 결과를 함께 보고 있습니다. 아직 진단하지 않은 팀원에게 초대 문구를 보낼 수 있습니다.') + '</p>' +

      status +

        return '<span class="chip' + (owner ? '' : ' ro') + '">' + avatar(m, 26) + esc(m.name) + leadTag(m) +
          (owner ? '<button type="button" data-rm="' + esc(m.id) + '" aria-label="' + esc(m.name) + ' 결과 삭제">×</button>' : '') + '</span>';
      }).join('') + '</div>' : '') +
      (dup && owner ? '<p class="cap">같은 이름이 두 번 있습니다. 예전 결과는 ×를 눌러 지워 주세요.</p>' : '') +

    if (!members.length) {

        (st === 'live' ? '초대 문구를 팀방에 올리고 기다려 주세요. 3명 이상 모이면 팀 해석이 나옵니다.' : '연결되면 제출된 결과가 여기에 나타납니다.') + '</p>' +

  function renderDemo() {
    app.innerHTML = '<main class="col wide">' +
      head('예시 팀 결과', '예시 7명입니다. 실제 팀 결과가 아닙니다.', '<a class="btn sm" href="#team">대시보드로 돌아가기</a>') +
      dashboardBody(Core.DEMO).replace('<div class="cards two" style="margin-top:16px">', '<div class="cards two">') + '</main>';
    drawCharts();
  }

  /* ---------- 주소에 따라 화면 고르기 ---------- */
  function route() {
    var h = location.hash || '', q = location.search || '';
    var r = /[#?&]r=([A-Za-z0-9_-]+)/.exec(h) || /[?&]r=([A-Za-z0-9_-]+)/.exec(q);
    var t = /[#?&]t=([A-Za-z0-9_-]+)/.exec(h) || /[?&]t=([A-Za-z0-9_-]+)/.exec(q);
    var j = /[#?&]j=([A-Za-z0-9]{6})(?![A-Za-z0-9])/.exec(h) || /[?&]j=([A-Za-z0-9]{6})(?![A-Za-z0-9])/.exec(q);
    shared = null;
    if (j) {
      try { history.replaceState(null, '', baseUrl()); } catch (e) {}
      view = 'home';
      if (CL) joinCode = CL.norm(j[1]);
      render();
      if (!CL) toast('이 앱은 팀 코드를 쓰지 않도록 설정되어 있습니다.');
      return;
    }
    if (r && CL) {
      try { history.replaceState(null, '', baseUrl()); } catch (e) {}
      view = 'home'; render(); toast('이 앱은 팀 코드로 결과를 모읍니다. 결과 링크는 쓰지 않습니다.');
      return;
    }
    if (r) {
      var m = Core.decodeMember(r[1]);
      try { history.replaceState(null, '', baseUrl() + '#team'); } catch (e) {}
      view = 'team';
      if (m) { var again = Team.add(m); render(); toast(m.name + ' 님의 결과를 ' + (again ? '새로 바꿨습니다.' : '추가했습니다.')); }
      else { render(); toast('결과 링크를 읽지 못했습니다. 링크 전체가 복사되었는지 확인해 주세요.'); }
      return;
    }
    if (t) {
      shared = Core.decodeTeam(t[1]);
      if (shared) { view = 'shared'; render(); return; }
      try { history.replaceState(null, '', baseUrl()); } catch (e) {}
      view = 'home'; render(); toast('팀 링크를 읽지 못했습니다. 링크 전체가 복사되었는지 확인해 주세요.');
      return;
    }
    view = h === '#team' ? 'team' : h === '#test' ? 'test' : h === '#result' ? 'result' : h === '#demo' ? 'demo' : 'home';
    render();
  }
  function render() {
    tipEl.style.display = 'none';
    if (view === 'team') renderTeam();
    else if (view === 'shared') renderShared();
    else if (view === 'test') renderTest();
    else if (view === 'result') renderResult();
    else if (view === 'demo') renderDemo();
    else renderHome();
    lastW = app.clientWidth;
  }

  window.addEventListener('hashchange', function () { route(); window.scrollTo(0, 0); });
  /* 다른 탭에서 결과 링크를 열면 이 탭의 대시보드도 갱신 */
  window.addEventListener('storage', function (e) {
    if (e.key === K.team && view === 'team') renderTeam();
    if (e.key === K.room && (view === 'home' || view === 'team')) render();
  });
  var rz;
  window.addEventListener('resize', function () {
    clearTimeout(rz);
    rz = setTimeout(function () { if (app.clientWidth !== lastW) { lastW = app.clientWidth; drawCharts(); } }, 150);
  });
  route();
})();
</script>
</body>
</html>
